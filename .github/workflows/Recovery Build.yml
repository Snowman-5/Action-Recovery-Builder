name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        type: choice
        description: Manifest Branch
        options:
          - 12.1
          - 11
          - 9.0
          - 8.1
          - 7.1
          - 6.0
        required: true
        default: 12.1

      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
        default: https://github.com/TeamWin/android_device_asus_I003D

      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
        default: android-12.1

      DEVICE_PATH:
        description: Path the device tree should be synced to, relative to source root
        required: true
        default: device/asus/I003D

      DEVICE_NAME:
        description: Device Name from tree (should match name on twrp_<DEVICE_NAME>.mk)
        required: true
        default: I003D

      REPOPICK_PATCHES:
        description: (Optional) Gerrit commit numbers separated by a space to be included in the build (leave blank if not using)
        type: string
        required: false

      BUILD_TARGET:
        type: choice
        description: Partition containing recovery ramdisk
        options:
          - boot
          - recovery
          - vendor_boot
        required: true
        default: recovery

      RECOVERY_INSTALLER:
        description: Include recovery installer zip
        type: boolean
        required: true
        default: false

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04

    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::User Environment Variables"
          echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
          echo "Device Tree URL: ${{ inputs.DEVICE_TREE_URL }}"
          echo "Device Tree Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ inputs.DEVICE_PATH }}"
          echo "Device Name: ${{ inputs.DEVICE_NAME }}"
          echo "Build Target: ${{ inputs.BUILD_TARGET }}.img"
          echo "Include Recovery Installer: ${{ inputs.RECOVERY_INSTALLER }}"
          echo "::endgroup::"

      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Prepare the environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo5
          sudo add-apt-repository universe
          sudo apt -y install libncurses5

      - name: Check Build Tree
        uses: haya14busa/action-cond@v1.2.1
        id: buildtree
        with:
          cond: ${{ inputs.MANIFEST_BRANCH == '11' || inputs.MANIFEST_BRANCH == '12.1' }}
          if_true: aosp
          if_false: omni

      - name: Install OpenJDK
        if: steps.buildtree.outputs.value == 'omni'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Install repo
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize repo
        run: |
          mkdir workspace
          cd workspace
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_${{ steps.buildtree.outputs.value }}.git -b twrp-${{ inputs.MANIFEST_BRANCH }}

      - name: Repo Sync
        run: |
          repo sync -j$(nproc --all) --force-sync
        working-directory: workspace

      - name: Create roomservice.xml
        run: |
          mkdir -p .repo/local_manifests
          cp -f ${GITHUB_WORKSPACE}/templates/*.xml .repo/local_manifests/
        working-directory: workspace

      - name: Clone device tree (TeamWin)
        if: |
          contains(inputs.DEVICE_TREE_URL, '/TeamWin/')
          && steps.buildtree.outputs.value == 'aosp'
        run: |
          sed -i "s%\!--project name=\"{DEVICE_TREE_URL_REPO}%project name=\"$(grep -oP '(?<=TeamWin/).*' <<< ${{ inputs.DEVICE_TREE_URL }})%g" .repo/local_manifests/roomservice.xml
          sed -i "s%{DEVICE_PATH}%${{ inputs.DEVICE_PATH }}%g" .repo/local_manifests/roomservice.xml
          sed -i "s%{DEVICE_REMOTE_NAME}%TeamWin%g" .repo/local_manifests/roomservice.xml
          sed -i "s%{DEVICE_TREE_BRANCH}\"/-->%${{ inputs.DEVICE_TREE_BRANCH }}\"/>%g" .repo/local_manifests/roomservice.xml
          repo sync -j$(nproc --all)
        working-directory: workspace

      - name: Clone device tree (Github/Other)
        if: |
          !contains(inputs.DEVICE_TREE_URL, '/TeamWin/')
          && steps.buildtree.outputs.value == 'aosp'
        run: |
          REMOTE_NAME=$(grep -oP '(?<=://).*(?=\.)' <<< ${{ inputs.DEVICE_TREE_URL }})
          REMOTE_FETCH=$(grep -oP '(?<=://).*?(?=\/)' <<< ${{ inputs.DEVICE_TREE_URL }})
          if [ "${REMOTE_NAME}" != "github" ]; then
            sed -i "s%\!--remote name=\"{REMOTE_NAME}%remote name=\"${REMOTE_NAME}%g" .repo/local_manifests/roomservice.xml
            sed -i "s%{REMOTE_FETCH}\"/-->%${REMOTE_FETCH}\"/>%g" .repo/local_manifests/roomservice.xml
          fi
          sed -i "s%\!--project name=\"{DEVICE_TREE_URL_REPO}%project name=\"$(grep -oP "(?<=${REMOTE_FETCH}/).*" <<< ${{ inputs.DEVICE_TREE_URL }})%g" .repo/local_manifests/roomservice.xml
          sed -i "s%{DEVICE_PATH}%${{ inputs.DEVICE_PATH }}%g" .repo/local_manifests/roomservice.xml
          sed -i "s%{DEVICE_REMOTE_NAME}%${REMOTE_NAME}%g" .repo/local_manifests/roomservice.xml
          sed -i "s%{DEVICE_TREE_BRANCH}\"/-->%${{ inputs.DEVICE_TREE_BRANCH }}\"/>%g" .repo/local_manifests/roomservice.xml
          repo sync -j$(nproc --all)
        working-directory: workspace

      - name: Clone device tree (Omni)
        if: steps.buildtree.outputs.value == 'omni'
        run: |
          git clone -b "${{ inputs.DEVICE_TREE_BRANCH }}" "${{ inputs.DEVICE_TREE_URL }}" "${{ inputs.DEVICE_PATH }}"
        working-directory: workspace

      - name: Sync Device Dependencies (AOSP)
        if: steps.buildtree.outputs.value == 'aosp'
        run: |
          source build/envsetup.sh
          lunch twrp_${{ inputs.DEVICE_NAME }}-eng
        working-directory: workspace
        id: syncdevicedeps
        continue-on-error: true

      - name: Sync Device Dependencies (Omni/subdevices)
        if: |
          steps.buildtree.outputs.value == 'omni'
          || steps.syncdevicedeps.outcome == 'failure'
        run: |
          bash ${GITHUB_WORKSPACE}/scripts/convert.sh ${{ inputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies
          repo sync -j$(nproc --all)
        working-directory: workspace
        continue-on-error: true

      - name: Repopick Gerrit patches
        if: inputs.REPOPICK_PATCHES != null
        run: |
          source build/envsetup.sh
          repopick -g https://gerrit.twrp.me ${{ inputs.REPOPICK_PATCHES }}
        working-directory: workspace
        continue-on-error: true

      - name: Include Recovery Installer
        if: inputs.RECOVERY_INSTALLER == true && inputs.MANIFEST_BRANCH != '6.0' && inputs.BUILD_TARGET != 'vendor_boot'
        run: |
          case ${{ inputs.MANIFEST_BRANCH }} in
            7.1)
              patchNum=5080
              ;;
            8.1)
              patchNum=5079
              ;;
            9.0)
              patchNum=5037
              ;;
            11)
              patchNum=4964
              ;;
            12.1)
              patchNum=5445
              ;;
          esac
          source build/envsetup.sh
          repopick -g https://gerrit.twrp.me ${patchNum}
        working-directory: workspace
        id: recoveryinstaller
        continue-on-error: true

      - name: Install Python 2
        if: steps.buildtree.outputs.value == 'omni'
        run: |
          sudo apt -y install python2
          cd /usr/bin
          sudo ln -sf python2 python

      - name: Building recovery (AOSP)
        if: steps.buildtree.outputs.value == 'aosp'
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          if [ ${{ inputs.RECOVERY_INSTALLER }} = true ] && [ ${{ steps.recoveryinstaller.outcome == 'success' }} ]; then
            export USE_RECOVERY_INSTALLER=true
            export RECOVERY_INSTALLER_PATH=bootable/recovery/installer
          fi
          lunch twrp_${{ inputs.DEVICE_NAME }}-eng && make $(tr -d _ <<< ${{ inputs.BUILD_TARGET }})image -j$(nproc --all)
        working-directory: workspace

      - name: Building recovery (Omni)
        if: steps.buildtree.outputs.value == 'omni'
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true

          if [ ${{ inputs.RECOVERY_INSTALLER }} = true ] && [ ${{ steps.recoveryinstaller.outcome == 'success' }} ]; then
            export USE_RECOVERY_INSTALLER=true
            export RECOVERY_INSTALLER_PATH=bootable/recovery/installer
          fi

          lunch ${{ steps.buildtree.outputs.value }}_${{ inputs.DEVICE_NAME }}-eng

          echo "===== RAMDISK COMPRESSION SETTINGS ====="
          get_build_var BOARD_RAMDISK_USE_LZMA || true
          get_build_var LZMA_RAMDISK_TARGETS || true
          get_build_var RECOVERY_RAMDISK_COMPRESSOR || true
          echo "========================================"

                    # Build recovery once to create the complete recovery/root tree
          make recoveryimage -j$(nproc --all)
          echo "===== BIGGEST FILES IN RECOVERY ROOT ====="
          find out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -50 || true
          echo "=========================================="
          echo "===== TERMINFO BEFORE ====="
          find out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root -type d -name terminfo -print 2>/dev/null || true
          
          echo "===== REMOVING TERMINFO ====="
          find out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root -type d -name terminfo -prune -exec rm -rf {} + 2>/dev/null || true

          echo "===== TERMINFO AFTER ====="
          echo "===== REMOVING EXTRA LANGUAGES ====="
          find out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root/twres/languages -type f ! -name 'en.xml' -delete 2>/dev/null || true
          du -sh out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root/twres/languages 2>/dev/null || true
          find out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root -type d -name terminfo -print 2>/dev/null || true
          echo "===== BIGGEST FILES AFTER TRIMMING ====="
          find out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -80 || true

          echo "===== BIGGEST DIRECTORIES AFTER TRIMMING ====="
          du -ah out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root 2>/dev/null | sort -rh | head -80 || true
          echo "=============================================="
                    echo "===== OPTIONAL FILE COMPRESSION TEST ====="
          for f in \
            sbin/nano \
            sbin/exfat-fuse \
            sbin/libexfat_twrp.so \
            sbin/mkexfatfs \
            sbin/libtwrpmtp-legacy.so \
            sbin/libssh.so \
            system/usr/share/zoneinfo/tzdata; do
            if [ -f "out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root/$f" ]; then
              printf "%s : " "$f"
              gzip -9 -c "out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root/$f" | wc -c
            fi
          done
          echo "=========================================="
          # Remove the existing image/ramdisk so make is forced to repack it
          rm -f out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
          rm -f out/target/product/${{ inputs.DEVICE_NAME }}/ramdisk-recovery.img
          rm -f out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root/sbin/me.twrp.twrpapp.apk
          rm -f out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root/sbin/privapp-permissions-twrpapp.xml
          echo "===== REPACKING RECOVERY ====="
          
          out/host/linux-x86/bin/mkbootfs out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root > out/target/product/${{ inputs.DEVICE_NAME }}/ramdisk-recovery.cpio
          gzip -9 -n -c out/target/product/${{ inputs.DEVICE_NAME }}/ramdisk-recovery.cpio > out/target/product/${{ inputs.DEVICE_NAME }}/ramdisk-recovery.img
          echo "===== DT CHECK ====="
          ls -l device/htc/m8qlul/prebuilt/dt || true
          file device/htc/m8qlul/prebuilt/dt || true
          wc -c device/htc/m8qlul/prebuilt/dt || true
          echo "===================="
          out/host/linux-x86/bin/mkbootimg --kernel out/target/product/${{ inputs.DEVICE_NAME }}/kernel --ramdisk out/target/product/${{ inputs.DEVICE_NAME }}/ramdisk-recovery.img --dt device/htc/m8qlul/prebuilt/dt --cmdline "console=none androidboot.hardware=qcom user_debug=31 ehci-hcd.park=3 androidboot.bootdevice=7824900.sdhci boot_cpus=0-7 androidtouch.htc_event=1 disk_mode_enable=1 androidboot.selinux=permissive buildvariant=userdebug" --base 0x80000000 --pagesize 2048 --output out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img --id > out/target/product/${{ inputs.DEVICE_NAME }}/recovery.id
          echo "===== FINAL IMAGE ====="
          ls -lh out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          stat -c '%n = %s bytes' out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          file out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          echo "======================="
        working-directory: workspace

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ inputs.DEVICE_NAME }}
          path: workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          if-no-files-found: error
